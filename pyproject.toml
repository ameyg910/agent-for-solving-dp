[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-dataset-factory"
version = "0.1.0"
description = "Automated dataset factory for dynamic programming reasoning"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "orjson>=3.10",
    "tenacity>=8.2",
]

[project.scripts]
dpfactory = "dpfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
